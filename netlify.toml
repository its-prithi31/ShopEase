# Netlify Configuration for ShopEase Full-Stack (Expo Web + Express API)
[build]
  command = "npm run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Route REST API requests to Netlify Serverless Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api"
  status = 200

# Single Page Application (SPA) fallback for Expo Web navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
